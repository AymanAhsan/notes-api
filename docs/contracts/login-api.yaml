openapi: 3.1.0
info:
  title: Login API
  version: 1.0.0
  description: Authenticate with an email address and password to receive an access token.
paths:
  /login:
    post:
      operationId: login
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - token
                properties:
                  token:
                    type: string
                    minLength: 1
        '401':
          description: Email or password is incorrect
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    type: string
